<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky Bliss — Scan Table QR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --gold: #dfb256;
            --gold-light: #fbe5a2;
            --gold-gradient: linear-gradient(135deg, #fbe5a2 0%, #dfb256 50%, #9e7424 100%);
            --navy-deep: #070c18;
            --navy-card: #0f182b;
            --navy-card-border: rgba(223, 178, 86, 0.35);
        }

        body {
            background-color: var(--navy-deep);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(223, 178, 86, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(30, 58, 138, 0.25) 0%, transparent 50%),
                linear-gradient(180deg, #070c18 0%, #0a1122 100%);
            color: #f3f4f6;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .cinzel {
            font-family: 'Cinzel', serif;
        }

        .qr-stand-card {
            background: linear-gradient(180deg, #0f182b 0%, #080f1e 100%);
            border: 2px solid var(--navy-card-border);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(223, 178, 86, 0.15);
            max-width: 420px;
            width: 100%;
            text-align: center;
            padding: 44px 28px;
            position: relative;
        }

        .qr-frame {
            background: #070c18;
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: 16px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(223, 178, 86, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .qr-frame:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(223, 178, 86, 0.3);
        }

        .qr-image {
            width: 250px;
            height: 250px;
            display: block;
            border-radius: 12px;
            object-fit: contain;
        }

        .brand-gradient {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <main class="qr-stand-card">
        <!-- Logo -->
        <div class="w-16 h-16 mx-auto mb-4 rounded-full border-2 border-[#dfb256] flex items-center justify-center bg-[#dfb256]/15 shadow-lg shadow-[#dfb256]/20">
            <i class="fa-solid fa-plane-departure text-2xl text-[#dfb256]"></i>
        </div>

        <!-- Restaurant Branding -->
        <h1 class="cinzel text-3xl font-extrabold tracking-widest brand-gradient">
            {{ settings.name|default:"Sky Bliss" }}
        </h1>
        <p class="cinzel text-xs tracking-[4px] text-[#e5c378] font-semibold mt-1">
            THE AEROPUB &bull; ROOFTOP LOUNGE
        </p>

        <!-- Instructions -->
        <div class="my-6">
            <span class="inline-block px-3 py-1 rounded-full bg-[#dfb256]/15 border border-[#dfb256]/30 text-[#fbe5a2] text-xs font-semibold tracking-wider uppercase">
                <i class="fa-solid fa-camera mr-1"></i> Scan with your phone camera
            </span>
        </div>

        <!-- The ONLY QR Code Displayed (No buttons, no download, pure QR standee) -->
        <a href="/menu/" class="qr-frame" title="Click or Scan to Open Menu">
            {% if settings.permanent_qr_image %}
            <img src="{{ settings.permanent_qr_image.url }}" alt="Sky Bliss Menu QR Code" class="qr-image">
            {% else %}
            <div class="w-[250px] h-[250px] flex items-center justify-center text-gray-400 text-sm">
                Generating QR Code...
            </div>
            {% endif %}
        </a>
    </main>

</body>
</html>
